<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A3B22" />
<title>IBN Larosh Enterprises · Quality Caps</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --g9:#0A3B22; --g7:#12683A; --gold:#C9962F; --gold-l:#E8C877;
  --cream:#FAF4E1; --paper:#FFFDF6; --ink:#14231B; --mut:#667066; --line:#E8DFC0; --wa:#25D366;
  --r:18px; --tab:62px; --safe:env(safe-area-inset-bottom,0px);
  --shadow:0 8px 24px rgba(10,59,34,.10);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font:400 15px/1.55 Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:calc(var(--tab) + var(--safe) + 16px)}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.15}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
.ic{width:20px;height:20px;flex:none}
.ic.wa{width:22px;height:22px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;background:var(--g9);color:#fff;box-shadow:0 1px 0 rgba(232,200,119,.35)}
.top .hin2{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--cream);display:grid;place-items:center;overflow:hidden;flex:none}
.mark img{height:32px;width:auto}
.wm{display:flex;flex-direction:column}
.wm b{font:700 17px/1 "Playfair Display",serif;letter-spacing:.07em;white-space:nowrap}
.wm small{font-size:8.5px;letter-spacing:.38em;color:var(--gold-l);margin-top:5px;font-weight:600}
.sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);transition:.15s}
.ib:active{transform:scale(.94)}
.ib.wa{background:var(--wa);color:#fff}
.dnav{display:none;gap:4px}
.dnav a{padding:8px 12px;border-radius:999px;font-size:14px;font-weight:500;opacity:.85}
.dnav a:hover,.dnav a.on{background:rgba(255,255,255,.12);opacity:1}

/* ---------- tab bar (mobile) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,253,246,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  height:calc(var(--tab) + var(--safe));padding-bottom:var(--safe);display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut)}
.tabs .pill{width:48px;height:28px;border-radius:14px;display:grid;place-items:center;transition:.2s}
.tabs a.on{color:var(--g9)}
.tabs a.on .pill{background:var(--g9);color:#fff}
.tabs .chat .pill{background:var(--wa);color:#fff;width:52px;height:34px;border-radius:17px;box-shadow:0 4px 12px rgba(37,211,102,.4)}

/* ---------- layout ---------- */
.pbar{padding-bottom:92px!important}
.page{max-width:1100px;margin:0 auto;padding:0 14px;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{padding:22px 0 4px}
.sh{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}
.sh h2{font-size:22px;color:var(--g9)}
.sh a{font-size:13px;font-weight:600;color:var(--g7);display:flex;align-items:center;gap:2px}
.sh a .ic{width:16px;height:16px}
.scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:2px 14px 6px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{scroll-snap-align:start;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:#fff}
.btn.green{background:var(--g9);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.line{border:1.5px solid var(--g9);color:var(--g9)}
.btn.block{width:100%}

/* ---------- hero ---------- */
.hero{background:var(--g9);color:#fff;border-radius:0 0 28px 28px;padding:22px 14px 26px;
  background-image:radial-gradient(circle at 90% 0%,rgba(232,200,119,.18),transparent 45%),radial-gradient(circle at 0% 100%,rgba(31,138,82,.5),transparent 50%)}
.hero .hin{max-width:1100px;margin:0 auto;display:grid;gap:20px}
.eye{display:inline-flex;align-items:center;gap:6px;color:var(--gold-l);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.eye .ic{width:14px;height:14px}
.hero h1{font-size:clamp(34px,9vw,56px);margin:8px 0 10px}
.hero h1 em{font-style:normal;color:var(--gold-l)}
.hero p{color:rgba(255,255,255,.78);max-width:42ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.slider{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;border:1px solid rgba(232,200,119,.45);box-shadow:0 14px 34px rgba(0,0,0,.35);background:#0d2a1b}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;justify-content:space-between;align-items:end;gap:8px}
.slide .cap b{font:600 16px "Playfair Display",serif}
.slide .cap span{font-size:12px;opacity:.85}
.dots{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);transition:.3s}
.dots i.on{width:20px;border-radius:4px;background:var(--gold-l)}

.perks{display:flex;gap:8px;overflow-x:auto;padding:16px 14px 2px;scrollbar-width:none;max-width:1100px;margin:0 auto}
.perks::-webkit-scrollbar{display:none}
.perk{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--paper);border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--g9)}
.perk .ic{color:var(--gold);width:17px;height:17px}

/* cats */
.cat{width:132px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.cat .bub{width:40px;height:40px;border-radius:12px;background:var(--g9);color:var(--gold-l);display:grid;place-items:center}
.cat b{font:600 15px "Playfair Display",serif;color:var(--g9)}
.cat small{color:var(--mut);font-size:12px;margin-top:-8px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden;background:#efe4bd}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:active .ph img{transform:scale(1.04)}
.tag{position:absolute;left:8px;top:8px;background:rgba(10,59,34,.88);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.cb{padding:11px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cb h3{font:600 15px/1.25 "Playfair Display",serif;color:var(--g9)}
.cb .sz{font-size:12px;color:var(--mut)}
.crow{display:flex;gap:8px;margin-top:auto;padding-top:9px}
.crow .v{flex:1;height:40px;border-radius:999px;border:1.5px solid var(--g9);color:var(--g9);font-weight:600;font-size:13.5px;display:grid;place-items:center}
.crow .w{width:40px;height:40px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;flex:none}
.hcard{width:156px}

/* steps */
.steps{display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step .n{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.step b{display:block;color:var(--g9)}
.step span{font-size:13px;color:var(--mut)}

.banner{background:var(--g9);color:#fff;border-radius:24px;padding:22px;display:grid;gap:10px;background-image:radial-gradient(circle at 100% 0,rgba(232,200,119,.22),transparent 55%)}
.banner h2{font-size:24px}
.banner p{color:rgba(255,255,255,.78);font-size:14px}

.loc{display:grid;gap:8px}
.locr{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.locr .ic{color:var(--gold)}
.locr b{display:block}.locr span{font-size:12.5px;color:var(--mut)}

/* catalog */
.ttl{padding:20px 0 6px}
.ttl h1{font-size:28px;color:var(--g9)}
.ttl p{color:var(--mut);font-size:14px}
.fbar{position:sticky;top:58px;z-index:20;background:var(--cream);padding:10px 0 6px;margin:0 -14px;padding-left:14px;padding-right:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:0 16px;height:48px}
.search:focus-within{border-color:var(--g7)}
.search input{border:0;outline:0;background:none;width:100%}
.search .ic{color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center}
.chip.on{background:var(--g9);border-color:var(--g9);color:#fff}
.lab{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:8px 0 0}
.meta{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px;font-size:13px;color:var(--mut)}
.meta select{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--mut);display:grid;gap:12px;justify-items:center}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;padding:14px 0 10px;font-weight:600;color:var(--g7);font-size:14px}
.dgrid{display:grid;gap:18px}
.big{border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);aspect-ratio:1/1;background:#efe4bd}
.big img{width:100%;height:100%;object-fit:cover}
.dinfo h1{font-size:28px;color:var(--g9);margin:8px 0}
.dinfo .d{color:var(--mut)}
.blk{margin-top:18px}
.blk h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes .chip{height:44px;min-width:58px;justify-content:center;font-size:15px}
.facts{display:grid;gap:8px}
.fact{display:flex;gap:10px;align-items:center;font-size:14px}
.fact .ic{color:var(--gold)}
.obar{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--safe));z-index:55;background:rgba(255,253,246,.98);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;align-items:center}
.obar .t{display:flex;flex-direction:column;line-height:1.2;font-size:12px;color:var(--mut)}
.obar .t b{font-size:17px;color:var(--g9)}
.obar .btn{flex:1}

/* info pages */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:12px}
.menu a{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;font-weight:600}
.menu a .bub{width:38px;height:38px;border-radius:11px;background:var(--g9);color:var(--gold-l);display:grid;place-items:center}
.menu a .go{margin-left:auto;color:var(--mut)}
.menu{display:grid;gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
details{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 16px}
details+details{margin-top:10px}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .ic{transition:.2s;color:var(--mut)}
details[open] summary .ic{transform:rotate(180deg)}
details p{padding:0 0 15px;color:var(--mut)}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600}
.in{width:100%;min-height:48px;padding:0 14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;outline:0}
textarea.in{padding:12px 14px;min-height:96px;resize:vertical}
.in:focus{border-color:var(--g7)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:#FFF4CC;border:1px solid #EBD58A;border-radius:14px;padding:11px 14px;font-size:13px;color:#6b5a1a}
.logo-full{width:min(320px,80%);border-radius:16px;margin:0 auto}
.urow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.urow img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.urow div{flex:1}
.del{width:40px;height:40px;border-radius:50%;border:1.5px solid #d9a5a0;color:#b3261e;display:grid;place-items:center}
footer{margin-top:34px;background:var(--g9);color:#d8e3d6;padding:24px 14px;font-size:13px;text-align:center}
footer b{color:var(--gold-l);font-family:"Playfair Display",serif;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--safe) + 78px);transform:translateX(-50%);background:var(--g9);color:#fff;padding:11px 18px;border-radius:999px;z-index:90;font-size:14px;box-shadow:var(--shadow)}

/* ---------- desktop ---------- */
@media(min-width:900px){
  body{padding-bottom:0}
  .tabs{display:none}
  .dnav{display:flex;margin-left:18px}
  .hero{padding:44px 24px 48px}
  .hero .hin{grid-template-columns:1.05fr .95fr;align-items:center;gap:40px}
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}
  .dgrid{grid-template-columns:1fr 1fr;gap:34px;align-items:start}
  .obar{position:static;background:none;border:0;padding:20px 0 0;backdrop-filter:none}
  .steps{grid-template-columns:repeat(3,1fr)}
  .loc{grid-template-columns:repeat(2,1fr)}
  .toast{bottom:24px}
  .pbar{padding-bottom:0!important}
  .hcard{width:210px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const state = {cat:"all", size:"all", q:"", sort:"new", focus:false};
function Catalog(){
  return `<div class="page">
  <div class="ttl"><h1>Browse caps</h1><p>Tap a cap to see sizes and order on WhatsApp.</p></div>
  <div class="fbar">
    <label class="search">${I("search")}<input id="q" type="search" placeholder="Search name or colour" value="${esc(state.q)}"></label>
    <div class="chips" id="fcat"></div>
    <div class="chips" id="fsize"></div>
  </div>
  <div class="meta"><span id="count"></span><select id="sort" aria-label="Sort"><option value="new">Newest</option><option value="size">Size: small to large</option></select></div>
  <div class="grid" id="grid"></div></div>`;
}
function paintCatalog(){
  const caps = allCaps(), sizes = [...new Set(caps.flatMap(c=>c.sizes))].sort((a,b)=>a-b);
  const chip = (on,a,l)=>`<button class="chip ${on?"on":""}" ${a}>${l}</button>`;
  document.getElementById("fcat").innerHTML = chip(state.cat==="all","data-fc='all'","All")+Object.entries(CATS).map(([k,v])=>chip(state.cat===k,`data-fc='${k}'`,v.label)).join("");
  document.getElementById("fsize").innerHTML = `<span class="chip" style="border:0;background:none;padding:0 4px;color:var(--mut);font-size:12px">SIZE</span>`+chip(state.size==="all","data-fs='all'","Any")+sizes.map(s=>chip(String(state.size)===String(s),`data-fs='${s}'`,s)).join("");
  let out = caps.filter(c=>(state.cat==="all"||c.cat===state.cat)&&(state.size==="all"||c.sizes.includes(Number(state.size)))&&(!state.q||(c.name+" "+c.colors.join(" ")).toLowerCase().includes(state.q.toLowerCase())));
  if(state.sort==="size") out.sort((a,b)=>a.sizes[0]-b.sizes[0]);
  document.getElementById("count").textContent = `${out.length} cap${out.length===1?"":"s"}`;
  document.getElementById("grid").innerHTML = out.length ? out.map(c=>card(c)).join("") :
    `<div class="empty">${I("search")}<p>No caps match your filters.</p><a class="btn wa" target="_blank" rel="noopener" href="${wa("Assalamu alaikum, I can't find a cap in the size/design I want on the site.")}">${WA()} Ask on WhatsApp</a></div>`;
  document.getElementById("sort").value = state.sort;
}

  return `<div class="page pbar">
  <a class="back" href="#/caps">${I("chevron-left")} All caps</a>
  <div class="dgrid">
    <div class="big"><img src="${src(c)}" alt="${esc(c.name)}"></div>
    <div class="dinfo">
      <span class="chip on" style="height:28px;font-size:11px;letter-spacing:.06em;text-transform:uppercase">${CATS[c.cat].label}</span>

/* ============ router ============ */
const app = document.getElementById("app");
const TABMAP = {home:"home",caps:"caps",custom:"custom"};
function route(){
  clearInterval(heroTimer);
  const [, seg="", arg] = (location.hash.replace(/^#/,"")||"/").split("/");
  const pages = {"":Home,caps:()=>arg?Detail(arg):Catalog(),custom:Custom,sizes:Sizes,delivery:Delivery,faq:FAQ,about:About,contact:Contact,more:More,admin:Admin};
  const key = seg||"home";
  app.innerHTML = (pages[seg]||(()=>`<div class="page"><div class="empty" style="padding:70px 0"><h2>404</h2><a class="btn green" href="#/">Home</a></div></div>`))() + `<footer><b>IBN Larosh Enterprises</b><br>Values You Trust, Quality You Deserve<br>${ADDRESS}<br>BN No. 9882187</footer>`;
  const tab = TABMAP[key]||"more";
  document.querySelectorAll("#tabs [data-t]").forEach(a=>a.classList.toggle("on",a.dataset.t===tab));
  document.querySelectorAll("#dnav a").forEach(a=>a.classList.toggle("on",a.dataset.p===key));
  if(seg==="caps"&&!arg){ paintCatalog(); if(state.focus){ document.getElementById("q").focus(); state.focus=false; } }
  if(!seg) startHero();
  window.scrollTo(0,0);
}
function startHero(){
  const sl=document.getElementById("sl"); if(!sl) return;
  const slides=[...sl.querySelectorAll(".slide")], dots=[...sl.querySelectorAll(".dots i")]; let n=0;
  heroTimer=setInterval(()=>{ slides[n].classList.remove("on"); dots[n].classList.remove("on"); n=(n+1)%slides.length; slides[n].classList.add("on"); dots[n].classList.add("on"); },3800);
}
window.addEventListener("hashchange",route);

/* ============ events ============ */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-search]")) state.focus=true;
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.cat){ state.cat=t.dataset.cat; state.size="all"; state.q=""; if(location.hash==="#/caps") route(); else location.hash="#/caps"; }
  else if(t.dataset.fc){ state.cat=t.dataset.fc; paintCatalog(); }
  else if(t.dataset.fs){ state.size=t.dataset.fs; paintCatalog(); }
  else if(t.dataset.size){
    document.querySelectorAll("#sizes .chip").forEach(c=>c.classList.toggle("on",c===t));
    const c=allCaps().find(x=>x.id===location.hash.split("/")[2]);
    document.getElementById("ord").href=orderLink(c,t.dataset.size); document.getElementById("selsz").textContent=t.dataset.size;
  }
  else if(t.dataset.del){ saveUser(userCaps().filter(c=>c.id!==t.dataset.del)); toast("Deleted"); route(); }
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ state.q=e.target.value; paintCatalog(); } });
document.addEventListener("change",e=>{ if(e.target.id==="sort"){ state.sort=e.target.value; paintCatalog(); } });
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="cf"){
    const f=new FormData(e.target);
    const msg=["Assalamu alaikum, I'd like a custom cap order:",f.get("name")&&`Name: ${f.get("name")}`,`Type: ${f.get("type")}`,f.get("size")&&`Size: ${f.get("size")}`,`Quantity: ${f.get("qty")}`,f.get("colors")&&`Colours: ${f.get("colors")}`,f.get("notes")&&`Design: ${f.get("notes")}`,"Delivery: Ilorin"].filter(Boolean).join("\n");
    window.open(wa(msg),"_blank","noopener");
  }
  if(e.target.id==="up"){
    const f=new FormData(e.target), file=document.getElementById("file").files[0];
    const sizes=f.get("sizes").split(",").map(s=>parseFloat(s)).filter(n=>!isNaN(n));
    if(!file||!sizes.length) return toast("Add a photo and at least one size");
    const img=await shrink(file);
    const cap={id:"u"+Date.now().toString(36),name:f.get("name"),cat:f.get("cat"),sizes,colors:f.get("colors").split(",").map(s=>s.trim()).filter(Boolean),desc:f.get("desc"),img};
    if(saveUser([cap,...userCaps()])){ toast("Cap saved"); route(); } else toast("Storage full, try a smaller photo");
  }
});
function shrink(file,max=900){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),cv=document.createElement("canvas");cv.width=i.width*k;cv.height=i.height*k;cv.getContext("2d").drawImage(i,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",.78));};i.onerror=rej;i.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

/* ============ boot ============ */
const hello = wa("Assalamu alaikum, I'd like to enquire about your caps.");
document.getElementById("hwa").href = hello; document.getElementById("twa").href = hello;
hydrate(); route();
</script>
